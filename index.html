<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · 个人空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f0f4ff 0%, #d9e2f0 100%);
            padding: 1rem;
        }

        .login-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.10);
            padding: 2.5rem 2rem 2.8rem;
            width: 100%;
            max-width: 400px;
            transition: transform 0.2s;
        }

        .login-card:hover {
            transform: scale(1.01);
        }

        .login-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e2a3a;
            margin-bottom: 0.3rem;
        }

        .login-card .sub {
            color: #6b7a8f;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 1.4rem;
        }

        .input-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            color: #2d3a4a;
            margin-bottom: 0.4rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafcff;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .input-group input::placeholder {
            color: #b0bccd;
        }

        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background: #2563eb;
            border: none;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .message {
            margin-top: 1.5rem;
            text-align: center;
            font-weight: 500;
            min-height: 2rem;
            color: #dc2626;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .footer-note {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.8rem;
            color: #9aa9b9;
            border-top: 1px solid #edf2f7;
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🔐 欢迎回来</h1>
        <p class="sub">请使用授权账户登录</p>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="input-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名"  />
            </div>
            <div class="input-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码"  />
            </div>
            <button type="submit" class="btn-login">登 录</button>
            <div id="message" class="message"></div>
        </form>

        <div class="footer-note">内部系统 · 请勿外传</div>
    </div>

    <script>
        // 固定凭证
        const VALID_USER = 'youqian';
        const VALID_PASS = '000000';

        function handleLogin(e) {
            e.preventDefault(); // 阻止表单默认提交

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgEl = document.getElementById('message');

            // 验证
            if (username === VALID_USER && password === VALID_PASS) {
                // 登录成功：存储登录状态，跳转到个人主页
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', username);
                window.location.href = 'my.html';
            } else {
                // 登录失败：显示“非法闯入”
                msgEl.textContent = '⚠️ 非法闯入！';
                msgEl.style.color = '#dc2626';
                // 清空密码框（提升安全）
                document.getElementById('password').value = '';
                // 3秒后清空提示（可选）
                // setTimeout(() => { msgEl.textContent = ''; }, 3000);
            }

            return false;
        }

        // 如果已经登录，直接跳转到 my.html（避免重复登录）
        window.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('loggedIn') === 'true') {
                window.location.href = 'my.html';
            }
        });
    </script>
</body>
</html>
